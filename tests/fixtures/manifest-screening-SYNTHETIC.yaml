notes: >
  record selector labels verbatim; never infer unguaranteed backend model IDs
  (SPEC 6.3). Claude billed via Vertex (project vital-octagon-19612); prices in the
  snapshot are global-endpoint list rates, with the us-central1 regional +10%
  premium recorded as a per-model sensitivity. C5 executor uses PRODUCT_B_ECON_TIER.
  Product B token telemetry is partial: unexposed usage -> unavailable (never 0),
  so a C3/C5 leg may be cost_unavailable at runtime; the provider-side collector
  (harness/collectors/) is what turns that into counts, at derived attribution.
  C2's semantics changed this window: the Product-A economical tier is now
  claude-sonnet-4-6 (it was the strong tier through batch 3). Product-B costing
  this window is CACHE-BLIND — see gemini_cache_blindness.
gemini_cache_blindness: >
  HUMAN DECISION 2026-08-16 (accepted; no probe run). Product-B (Gemini) costing
  for the screening window is CACHE-BLIND, and every Gemini leg — solo C3/C3-med/
  C3-prev and the C5 executor — carries cost_basis_qualifier
  cache_blind_upper_bound. Basis for the decision: the provider-side token metric
  (aiplatform.googleapis.com/publisher/online_serving/token_count) emits only
  type=input and type=output for publisher="google" on this project, and the
  explicit_caching label appears on zero google series, while the anthropic series
  carry cache_read_input / cache_write_input / cache_write_1h_input. Evidence:
  report/findings/vertex-token-metric-surface-2026-08-16.md finding 2. So a Gemini
  leg's cache_read_tokens / cache_creation_tokens have no provider-side series to
  fill them; they stay unavailable (never 0), and any Gemini cost derived from
  input+output alone prices every input token at the full input rate.
  DIRECTION OF THE ERROR: implicit provider-side caching, if it happens, can only
  make real Gemini spend LOWER than the computed figure (cached input bills at the
  cheaper cache-read rate) — hence "upper bound". The basis name says so; do not
  restate a cache-blind figure as an exact cost.
  SCOPE: cross-product cache comparisons stay OUT OF SCOPE this window (SPEC 2.9).
  A Product-A vs Product-B cache-efficiency claim is not derivable from a
  cache-blind Product-B figure and must not be made.
  MECHANISM NOTE: cost_basis itself remains marginal_api_cost. The telemetry
  schema's cost_basis enum is frozen at four values and widening it is a CP-SCHEMA
  decision that has NOT been taken; cost_basis_qualifier is an additive field
  (legs[] and economics accept additional properties) that records how the
  marginal cost was derived without touching the frozen enum.
effort_rule: >
  Effort level is a within-product arm, never mixed with routing. ALL C5 executor
  legs are pinned to a "(High)" selector; the effort-level comparison is C3 vs
  C3-med ONLY, and both are SOLO arms. A C5 run that used a "(Medium)" executor
  would confound routing with effort and must not be planned. Effort changes token
  CONSUMPTION, not the per-token rate — the (High) and (Medium) rate-card rows in
  pricing/prices-2026-08-16.json are deliberately identical and deliberately
  separate keys.
print_timeout_basis: >
  15m0s, raised from agy's 5m0s default (`agy --help`: "--print-timeout Timeout for
  print mode wait (default 5m0s)"). Grounded in the batch-3-era wallclocks, and
  stated as a BOUND rather than an estimate because the only Product-B datapoint is
  right-censored: the 2026-07-26 verified-invocation smoke (dataset archived at tag
  pre-cleanup-2026-08-27, agy
  1.1.7) ran 360.1s agent-leg wallclock and ended in agy's own "Error: timeout
  waiting for response" (exit 1) at the 5-minute default — so Product B needs MORE
  than 5 minutes on the pilot task and we do not know how much more. The batch-1/2
  C3 runs (0.4-1.0s) are the bogus-`run`-token defect, not evidence. For scale, the
  slowest Product-A leg ever observed on the same task is 213.1s (batch-3 P1
  economical attempt), with batch-3 medians under 90s. 900s is 3x the default and
  >4x the slowest observed Product-A leg, while staying well under the adapter's
  own 1800s subprocess kill (agy.DEFAULT_TIMEOUT_S) so the product's timeout always
  fires first and yields a diagnosable product error instead of an opaque harness
  kill. Re-estimate from the first screening batch's completed runs.

# Subject sandbox posture (SPEC 1.3; human decision 2026-07-19, cp-spend-batch2-plan
# §3.1). Recorded per run in identity.permission_profile + identity.network_policy
# (authoritative; the runner stamps the mode it launched). Batch 1/revalidation used
# the HOST posture; batch 2 uses CONTAINER. Implemented as a NO-SPEND harness change
# (containerization before pre-mod validation, so validation runs under the SAME
# posture as the batch it validates for — no posture delta).
subject_isolation:
  # Posture is recorded verbatim per run in identity.permission_profile +
  # identity.network_policy (CP-SPEND 2026-07-20, decision 4 + containerization-gap
  # finding). BATCH 2/3 (historical): the deterministic GATE was containerized +
  # offline, while the live AGENT leg ran HOST because the containerized agent leg
  # was unimplemented (no claude/agy/creds in Dockerfile.subject; resolve_spawn
  # passed no egress/creds). Those runs' stamps say so and remain accurate.
  # PHASE 4: the containerized agent leg + endpoint-allowlist egress are HARD
  # REQUIREMENTS for the screening CP-SPEND; they are built (see agent_leg below).
  gate_posture: container       # deterministic gate: docker run --network=none (offline)
  agent_leg_posture: host       # batch-2/3 live agent leg (historical; see agent_leg)
  batch2_network_policy: no-network-policy   # host agent leg; recorded verbatim per run
  network_policy: none          # graded gate runs fully offline (docker run --network=none)
  image: per-task baked         # harness/container/Dockerfile.subject; deps baked at BUILD time
  gate_verified_offline: w1-2026-07-19   # W1 public gate ran offline in-container (pre-mod FAIL; canonical PASS)
  batch1_posture: host          # skip-all-tools; cwd-confined; dev-vm; no-container (superseded)

  # --- Phase-4 screening prerequisite: the containerized agent leg (SPEC §6 item 1).
  # Built 2026-08-16, no spend. Supersedes agent_leg_egress: deferred_to_phase4.
  # `--subject-isolation container` now runs the AGENT in its own image on an
  # egress-allowlist network and grades its edits in the offline gate image;
  # `--subject-isolation host` remains available as the feasibility fallback.
  agent_leg:
    posture: container_available   # host remains the fallback (--subject-isolation host)
    image_target: subject-agent    # harness/container/Dockerfile.subject
    gate_image_target: subject-gate
    task_material_in_agent_image: none   # build-asserted (assert-no-task-material /)
    credentials: adc_read_only     # host gcloud config mounted ro at /creds/gcloud
    handoff: named_volume          # agent edits reach the gate container via a per-run volume
    # Product CLI versions BAKED INTO the agent image and asserted at build time.
    # These are the versions that actually run; the host's are irrelevant to a
    # containerized leg, and identity.product_version is read from the image label.
    claude_cli_version: 2.1.233
    agy_version: 1.1.13
    # agy has no verifiable public download URL, so the binary is vendored from the
    # build host by harness/container/stage-agy.sh and pinned by content hash. The
    # image build fails if the staged binary's sha256 or self-reported version differ.
    agy_sha256: 416b197e4b38c797c8661098f0af2bb4e1323ffe3c286d5e9b6408cf7d7ee920
    # agy version drift — RESOLVED by human decision 2026-08-16: pin 1.1.13.
    # SPEC 2.9 records the drift 1.1.4 -> 1.1.7, and the 2026-07-26 smoke (the only
    # verified-invocation Product-B run) recorded product_version 1.1.7. The screening
    # brief asked for a 1.1.7 pin. The binary on this host self-reports 1.1.13
    # (agy_sha256 above matches it byte-for-byte), agy self-updates, and there is no
    # verifiable public download URL from which 1.1.7 could be re-obtained or hashed.
    # Pinning 1.1.7 would therefore pin a version we cannot stage: the image build and
    # every agy run would fail loudly at once. The pin is the version that is actually
    # present and hash-verified, and the discrepancy stays on the record below rather
    # than being papered over. Re-pinning to 1.1.7 would need the human to supply the
    # binary; this pin and agy_sha256 would change together.
    agy_version_drift:
      spec_2_9_recorded: "1.1.4 -> 1.1.7"
      last_run_observed: "1.1.7"        # smoke ...__C3__rep1__20260726T093603 (archived at tag)
      host_today: "1.1.13"              # `agy --version`, 2026-08-16
      brief_requested: "1.1.7"
      resolution: pinned_to_host_today  # human decision 2026-08-16; 1.1.7 unobtainable
      resolved_date: 2026-08-16
    # Selector-label re-check under the pinned version. The pins were read under an
    # earlier invocation, so a version pin is only meaningful if the labels it
    # resolves are the same ones the manifest names. Re-run of `agy models` under
    # 1.1.13 (local listing, no spend, not logged in) printed all three pinned labels
    # byte-for-byte unchanged; nothing was re-pinned as a result.
    agy_models_recheck:
      date: 2026-08-16
      under_version: "1.1.13"
      labels_unchanged: true
      labels_verified:
        - "Gemini 3.7 Flash (High)"
        - "Gemini 3.7 Flash (Medium)"
        - "Gemini 3.6 Flash (High)"
      # Corroborates the collector's effort-attribution finding from the other side:
      # agy's own slug column DOES carry the effort suffix (gemini-3.7-flash-high),
      # while the billing plane's model_user_id does not — so the label separation
      # exists in the product and is lost at the meter.
      slug_column_carries_effort_suffix: true
    # agy self-updates in-process (third_party/jetski/cli/updater/auto_updater.go).
    # PINNED CONDITION for the screening window: the updater is disabled via the
    # product's own env var, which the adapter sets on every invocation, so a batch
    # cannot silently change product version mid-window. Recorded per selector as
    # conditions.auto_update.
    agy_auto_update: disabled_via_AGY_CLI_DISABLE_AUTO_UPDATE
    # Evidence for that switch, stated at the strength it actually has. The env var
    # name and its handler are read from the shipped binary, and the updater is
    # observed running in a normal invocation; what is NOT yet on the record is a
    # matched negative control (same invocation shape, var set, updater silent),
    # because the only invocation observed to reach the updater is a live --print
    # run and this session has no spend approval for another one. Treated as a
    # belt-and-braces measure: the version pin, the pre-batch runner check and the
    # in-adapter check are what actually enforce the condition, and all three fail
    # loudly if an update lands anyway.
    agy_auto_update_evidence:
      env_var_and_handler_in_binary: true   # `strings`: "Auto-update disabled via environment variable %s"
      updater_observed_active: "auto_updater.go:252 'skipping update (fast path)', 2026-08-16 14:59 live smoke"
      matched_negative_control: not_yet_observed   # needs one live agy invocation
      enforced_regardless_by:
        - harness/runner/run.py preflight_product_versions  # refuses before anything is created
        - harness/adapters/agy.py ProductVersionMismatch    # refuses before spend, per attempt
        - harness/container/stage-agy.sh agy_sha256 assert  # image build fails on drift
    # Cross-check: configurations.PRODUCT_B_*.conditions.agy_version must equal
    # agy_version above, or a containerized run would enforce a different version
    # than the adapter checks. tests/test_manifest_pricing.py asserts the agreement.
    agy_source: vendored_from_build_host   # no verifiable public install URL exists
  agent_leg_egress:
    policy_file: harness/container/egress/allowlist-model-api.txt
    policy_sha256: ce78aa16d5450d44486ba80d12ee8f465a1e1b0d83d2dbbd30653fcc27475e2c
    policy_name: model-api-v1
    mechanism: internal_docker_network_plus_deny_by_default_proxy
    host_patterns: 9
    connect_ports: [443]
    # Enforcement verified with no model spend (harness/container/verify-egress.sh,
    # 2026-08-16): no route without the proxy; allowlisted host reachable;
    # non-allowlisted host refused 403; non-443 CONNECT refused.
    enforcement_verified: 2026-08-16
    # SUFFICIENCY for a live agentic run is NOT established and cannot be without
    # spend. The Product-B entries in particular are sourced from binary strings,
    # not from an observed agy run. First CP-SPEND screening run is the test; the
    # proxy log names any refused host.
    sufficiency_verified: unavailable
  gate_egress: none               # the deterministic gate is always docker run --network=none

