site_name: Measure Before You Route
site_description: The unit-economics audit layer for AI coding agents — measure what AI
  coding agents cost per accepted engineering outcome.
repo_url: https://github.com/catwang42/Developer-Agent-Tokenomics-Decision-Lab
repo_name: Developer-Agent-Tokenomics-Decision-Lab
theme:
  name: material
  features: [navigation.sections, navigation.top, content.code.copy]
  palette:
    - scheme: default
      primary: deep purple
nav:
  - Home: index.md
  - Start here:
      - Pre-work Setup: setup.md
      - "Operator Guide — run the lab, no AI required": OPERATOR.md
      - "Cheatsheet — the seven-point audit checklist": cheatsheet.md
  - Modules:
      - "M0 · The Decision Problem": m0-decision-problem.md
      - "M1 · Audit the Evidence": m1-audit-evidence.md
      - "M2 · One Controlled Experiment": m2-controlled-experiment.md
      - "M3 · Interpret the Economics": m3-interpret-economics.md
      - "M4 · Enterprise Decision Exercise": m4-decision-exercise.md
      - Exercises: exercises/index.md
      - Facilitator Guide: facilitator.md
  - How it measures:
      - "Sealed Evaluation — how work is graded": sealed-evaluation.md
      - "Evidence & Methodology — the underlying records": evidence.md
  - Results:
      - "Screening Report (renderer — no data until CP-FINDINGS)": screening-report.md
markdown_extensions: [admonition, tables, attr_list, pymdownx.details, pymdownx.superfences]
# The screening renderer. Both assets no-op on every other page: the script only draws
# when it finds the #decision-report mount point.
extra_css:
  - assets/decision-report.css
extra_javascript:
  - assets/decision-report.js
# docs/assets/data/ holds hand-copied decision tables for local review; the directory is
# gitignored so no real figure is committed, and CP-PUBLISH gates any deploy that would
# carry one. Its README explains that to repo readers and is not a site page, so it is
# excluded from the build rather than left to become a stray URL.
exclude_docs: |
  assets/data/README.md
