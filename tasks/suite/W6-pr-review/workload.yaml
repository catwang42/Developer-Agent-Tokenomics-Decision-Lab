# Task definition and gate wiring: task.yaml.
repo: https://github.com/honojs/hono
pinned_commit: 3feb3551d46de1f633e82253f12cf1117316be93
contamination_tier: post_cutoff     # merged 2026-08-03; model-relative, see tasks/WORKLOAD-SELECTION.md §2
license: MIT
stars_at_mining: 31686              # recorded 2026-08-16 via the GitHub API
language: typescript
task_dir: tasks/suite/W6-pr-review
prompt: |
  FINALIZED in task.yaml (`prompt:`) — that is the single source of truth for the
  participant-visible text. Summary: review the pinned RegExpRouter diff and report
  every defect justifiable FROM THE DIFF, one per line as
  `<path>:<line> — <one-sentence description>`; style/naming/missing-tests are out
  of scope; a reported issue that is not a real defect counts against you.
  (MUST NOT ask the model to report its own tokens — it does not.)
gate:
  # Deterministic scoring against a sealed map of the k seeded defects. Detection is
  # matched by file+line/defect-id, NOT by model judgment — this is a deterministic
  # gate over a known ground truth, consistent with SPEC §2.6.
  public: gate/check-public.sh
  hidden: recorded-by-hash-at-run     # sealed seeded-defect map + evaluator, human-held under hidden/
  reset: reset.sh
pass_condition: >
  Detects >= k-1 of the k seeded defects AND reports zero fabricated issues
  (any reported defect not in the seeded map counts as a fabrication). k recorded
  in the sealed map at pre-registration.
expected_wallclock_s: null
# Arms: the AUTHORITY is each task's task.yaml, because arms are registered per
# TASK, not per workload (cp-screen-prereg.md §4). This line is the union over
# W6 only — no C5: a review task has no executor deliverable, kept in sync for readability only.
configurations: [P0, C2, C3, C3-med, C3-prev]
reps_screening: 3
class_claim_note: >
  One task = screening signal only. A workload-class claim requires a second,
  materially different task from this class at tier obscure or post_cutoff
  (tasks/WORKLOAD-SELECTION.md §3, extending SPEC §5.2); commit mining preferred (§4).
  W6 currently has ONE task, so any W6 result is a screening signal about THIS task,
  never a claim about code review as a workload class.
escalation_probe_note: >
  SPEC §5.1 names W6 the primary escalation-probe candidate and W3 the fallback. For
  the screening batch the DESIGNATED probe is W3 (tasks/suite/W3-migration), which
  carries the registered failure prediction. W6 may additionally carry a prediction;
  if so it must be registered in manifest/preregistrations/ before any run.
preregistration: TBD                # register k + the defect-map hash before any run
human_authored_pending:
  - hidden/review-diff.patch        # base-diff with k defects seeded
  - hidden/defect-map.json          # ground truth
  - hidden/check.sh                 # deterministic matcher (exit 0/1/2)
  - hidden/VERSION
  # Instructions: tasks/suite/W6-pr-review/hidden/README-FOR-HUMAN.md
