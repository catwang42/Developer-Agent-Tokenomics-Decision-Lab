# Pilot task definition (SPEC 2.8: the RealWorld *feature* task). Volatile pins are
# authoritative in manifest/delivery-manifest.yaml (pilot_task); this file mirrors
# them and adds gate wiring. Manifest wins on disagreement (tests/test_tasks.py).
# Driven by the shared harness:
#   TASK_DIR=tasks/pilot-realworld bash harness/task-tools/validate.sh
task_id: pilot-realworld-draft-articles
manifest_key: pilot_task
task_suite_version: pilot-v2   # v2 (2026-07-19): prompt pins the query-contract
# shape + edit scope after a gate-fairness audit found a functionally-plausible
# solution failing the shape-based DB-free test (see report/findings/gate-fairness-audit.md).
# Tests/gate/sealed-hidden-test UNCHANGED (hash sealed-pilot-v1 stands) — the gate
# was NOT loosened; only the prompt was made unambiguous.
class: feature_implementation

# Source. RealWorld/Conduit API (MIT). Feature authored by us (not commit-mined):
# the Draft-articles feature does not exist at the pinned commit.
repo: https://github.com/gothinkster/node-express-realworld-example-app
pinned_commit: 30b68e1e881462b2f4164ea09ab4c4f5699c7b0b
license: MIT
contamination_tier: famous

# Participant-visible prompt. Must NOT ask the model to report its own tokens.
prompt: |
  Add a "Draft articles" feature to the RealWorld API, matching this contract:

  - Schema: add a `draft Boolean @default(false)` field to the `Article` model in
    src/prisma/schema.prisma.
  - Create: in `createArticle`, persist the request's `draft` value into the Prisma
    `create` `data` (default to false when the field is absent).
  - Public list: in `getArticles`, exclude drafts from GET /articles by adding a
    `{ draft: false }` condition to the top-level `AND` array of the `where` passed
    to `prisma.article.count` and `prisma.article.findMany`, so only non-draft
    articles are returned. Use that exact condition shape (a plain `{ draft: false }`
    entry in the `AND` array), consistent with how other filters are added.

  Edit ONLY these two files: src/app/routes/article/article.service.ts and
  src/prisma/schema.prisma. Do NOT modify any test file or any other file. Keep the
  change minimal and consistent with existing Prisma/service patterns; no unrelated
  diffs.

# Acceptance gate (SPEC 2.6 deterministic-first; hidden test is authoritative).
canonical_patch: canonical/draft-articles.patch   # PRODUCT code only (no test files)
public_test: tests/draft-articles.public.test.ts
public_test_desc: Draft articles feature spec (create persists draft; list excludes drafts)
public_test_kind: feature   # pre-mod failure: field/behaviour absent on unmodified repo (SPEC 2.8)
# Agent-allowed diff scope: PRODUCT files only. The gate restores all test files to
# pristine before grading and forbids any agent edit to a test file (diff-scope),
# so a solution cannot pass by weakening tests.
target_paths:
  - src/app/routes/article/article.service.ts
  - src/prisma/schema.prisma
# Harness-owned type-compat shim (NOT part of the agent's solution, NOT agent-
# modifiable). The new `draft` field is required-typed in the generated Prisma
# client, so the immutable baseline suite's result mocks need `draft` to compile.
# The gate applies this AFTER restoring tests to pristine; it touches only *.test.ts.
test_compat_patch: gate/test-compat.patch

# Baseline scoped to hermetic DB-free suites (upstream auth suite needs a live DB;
# see harness/task-tools/README.md and tasks/WORKLOAD-SELECTION.md).
baseline_test_scope: hermetic_db_free
baseline_test_pattern: "article|profile|utils"
static_checks: [typecheck, build]

expected_wallclock_s: null       # measured in Phase 3; never fabricated

# Config declarations (SPEC §2.3; ENFORCED by tests/test_tasks.py
# ConfigurationDeclarations). A configuration run against this task MUST appear in the
# list that governs the phase it ran in, or the enforcement test fails.
#
# `configurations` is the CURRENT registered arm set — since 2026-08-17 that is the
# screening matrix of manifest/cp-screen-prereg.md §4, which is authoritative. This
# task is F1: five solo arms, C5/P3, and the optional P2 (F1 and F3 are the only two
# tasks with a frozen split.yaml, which is what P2 requires).
#
# `feasibility_configurations` is FROZEN HISTORY, not a plan: the controlled set
# batch 2 actually ran (SPEC §2.3 "27"). It is kept as its own key rather than
# overwritten, because the batch-2 conformance check joins on it — that check is what
# catches the out-of-plan F1·C3 / F1·C5 companion runs, which were dropped from the
# re-collection and are deliberately absent from it. Folding it into
# `configurations` would have made those two violations disappear the moment C3 and
# C5 became registered screening arms.
#
# `companion_configurations` = SPEC §2.3 companion feasibility runs against THIS task
# (warm-series C1) — not controlled, and also history.
configurations: [P0, C2, C3, C3-med, C3-prev, C5, P2]   # registered screening matrix (prereg §4)
feasibility_configurations: [P0, C2, P1]   # frozen: what batch 2 ran; do not edit
companion_configurations: [C1]   # cache warm-series companion; C3/C5 dropped from re-collection
reps_feasibility: 3
reps_screening: 3
