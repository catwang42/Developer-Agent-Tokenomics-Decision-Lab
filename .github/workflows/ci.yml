name: ci
on:
  push: {branches: [main]}
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          pip install mkdocs-material pyyaml
      - name: Set up project venv (pinned requirements)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
      # Prune set matches tests/run-tests.sh prune_find. `*/hidden` and `*/.work`
      # matter: sealed human-held gate scripts must never be linted or read by a
      # gate (they are gitignored, so a CI checkout has none — but a self-hosted
      # or resumed runner can), and .work/ holds subject clones + run reports.
      - name: Shellcheck
        run: |
          mapfile -d '' files < <(find . \( -path './.git' -o -path '*/node_modules' -o -path './.venv' -o -path './site' -o -path '*/__pycache__*' -o -path './results/cohort' -o -path '*/hidden' -o -path '*/.work' \) -prune -o -type f -name '*.sh' -print0)
          if [ "${#files[@]}" -gt 0 ]; then shellcheck -x "${files[@]}"; fi
      - name: Validate JSON/YAML
        run: |
          prune_find() { find . \( -path './.git' -o -path '*/node_modules' -o -path './.venv' -o -path './site' -o -path '*/__pycache__*' -o -path './results/cohort' -o -path '*/hidden' -o -path '*/.work' \) -prune -o -type f "$@" -print0; }
          prune_find -name '*.json' | xargs -0 -r -I{} python3 -c "import json,sys; json.load(open(sys.argv[1]))" {}
          prune_find \( -name '*.yml' -o -name '*.yaml' \) | xargs -0 -r -I{} python3 -c "import yaml,sys; yaml.safe_load(open(sys.argv[1]))" {}
      - name: Tests
        run: bash tests/run-tests.sh
      - name: Docs build
        run: mkdocs build --strict
