# tinyproxy config for the lab egress allowlist. Deny-by-default.
#
# The proxy runs on an internal Docker network shared only with agent containers,
# so `Allow 0.0.0.0/0` scopes *who may use the proxy* to that network — it is not
# an open relay on the host. What may be REACHED is controlled by the Filter file.

Port 8888
Listen 0.0.0.0
Timeout 900

# Log to stdout so `docker logs` shows every refusal by hostname (the audit trail
# that tells a failed run which endpoint it needed).
LogLevel Info

MaxClients 100
StartServers 2

# Who may use the proxy: the internal network only (no host port is published).
Allow 0.0.0.0/0

# What may be reached: deny-by-default, allow only the allowlist regexes. The
# filter matches the HOST (not the URL), so it applies identically to plain HTTP
# requests and to CONNECT tunnels — which is what all model-API traffic is.
FilterDefaultDeny Yes
FilterExtended On
FilterCaseSensitive Off
FilterURLs Off
Filter "/etc/tinyproxy/allowlist.txt"

# TLS only. CONNECT to any other port is refused regardless of host.
ConnectPort 443

DisableViaHeader Yes
