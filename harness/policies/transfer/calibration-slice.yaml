# --------------------------------------------------------------------------- #
# Gate — evaluated by the runner, automatic, exits non-zero on failure
# --------------------------------------------------------------------------- #
gate:
  authority: manifest/preregistrations/2026-08-27-transfer-probe.md
  criteria:
    - id: pass_match
      rule: "per-task pass/fail matches `published.<arm>.passed` on >= 4 of 5"
      gating: true
    - id: cost_within_30pct
      rule: "abs(measured_slice_usd - published_slice_usd) / published_slice_usd <= 0.30"
      gating: true
  applies_to: [r9, r6, r10]        # every strategy, independently
  on_failure:
    exit_code: nonzero
    report: written anyway
    downstream: >
      harness/runner/transfer_probe.py refuses to start unless a report exists
      for EVERY strategy with both criteria passing.
    prereg_consequence: "Fail -> stop. The fidelity finding is published instead of a transfer verdict."
  diagnostics_recorded_but_not_gating:
    - id: routing_shape_match
      rule: "per-task escalation decisions and rung count vs `published.<arm>.rungs`"
      why: >
        Separates "the routing logic differs" from "the models differ". A slice
        that fails pass_match with matching routing shape is a model-quality
        result; one that fails with a different routing shape is a
        reimplementation bug.
    - id: token_volume_delta
      rule: "measured input/output tokens vs `published_slice_reference.<arm>`"
    - id: frontier_reachability
      rule: "the frontier was called at least once across the slice"
      why: >
        The source ships `frontier_is_reachable()` because five arms once
        shipped in which the frontier branch was unreachable and nothing said
        so. A calibration in which the frontier never fires is void regardless
        of what it scores.

# --------------------------------------------------------------------------- #
# BLOCKER — criterion `cost_within_30pct` is not reachable on the lab ladder
# --------------------------------------------------------------------------- #
cost_criterion_blocker:
  status: OPEN — needs a human decision before calibration is launched
  problem: >
    The published costs are for the source's ladder (gemini-3.5-flash-lite ->
    gemini-3.7-flash low -> gemini-3.7-flash medium -> claude-opus-5). Judgment
    call J-2 in all three specs runs the lab ladder instead (3x
    ECONOMICAL_MODEL_A -> STRONG_MODEL_A). Criterion (b) compares a lab-ladder
    bill against a source-ladder bill, so it measures the price difference
    between two model families, not the fidelity of the reimplementation.
  derived_estimate:
    what: >
      The published slice TOKEN VOLUMES re-priced at this lab's own rate card.
      This holds volume fixed and varies only price, so it isolates the
      price-only component of the gap. It is a DERIVED figure from published
      numbers, not a measurement.
    rate_card: pricing/prices-2026-08-16.json
    rates_used:
      claude-sonnet-4-6@default: {input_per_mtok: 3.0, output_per_mtok: 15.0}
      claude-opus-5@default:     {input_per_mtok: 5.0, output_per_mtok: 25.0}
    band_note: >
      Lower bound prices the whole slice at ECONOMICAL_MODEL_A rates; upper
      bound prices it at STRONG_MODEL_A rates. The real figure sits between,
      because every arm mixes cheap rungs with at most one frontier call.
    r9:  {published_usd: 0.218522, derived_all_economical_usd: 0.317334, derived_all_strong_usd: 0.528890, band_ratio: "1.5x - 2.4x"}
    r6:  {published_usd: 0.320921, derived_all_economical_usd: 0.602934, derived_all_strong_usd: 1.004890, band_ratio: "1.9x - 3.1x"}
    r10: {published_usd: 0.212058, derived_all_economical_usd: 0.394887, derived_all_strong_usd: 0.658145, band_ratio: "1.9x - 3.1x"}
    conclusion: >
      The tightest point in the band is +45% (r9, everything at economical
      rates). The +-30% window closes at +30%. Criterion (b) is therefore
      STRUCTURALLY UNPASSABLE on the lab ladder before a single token is spent,
      and that is true from price alone — a real run would also change volume.
  options:
    - id: O1
      what: Launch as specified and accept the failure.
      consequence: >
        Calibration exits non-zero, the probe driver refuses, and per the prereg
        the fidelity finding is published instead of a transfer verdict. Costs
        real money to learn something this file already shows arithmetically.
    - id: O2
      what: Calibrate on the source's own ladder.
      needs: >
        A direct provider-API adapter (the source calls raw APIs, not agent
        CLIs), a pricing row for gemini-3.5-flash-lite (absent from
        pricing/prices-2026-08-16.json), and thinking-level selectors the
        Product-B surface does not expose. Touches pricing/ and the manifest.
      consequence: >
        Makes criterion (b) mean what it says. Largest change; the calibration
        would then validate the routing logic only, and would certify nothing
        about the probe's own ladder.
    - id: O3
      what: Amend criterion (b) to a ladder-normalised form.
      examples: >
        +-30% on token VOLUME rather than USD; or +-30% on the cost RATIOS
        BETWEEN arms (r6/r9, r10/r9), which is what the rank-preservation
        question actually needs.
      consequence: A prereg amendment. Must be recorded as one, dated, before any run.
  decision: NOT TAKEN HERE. The runner implements criterion (b) exactly as the
    prereg words it, computes the diagnostics above alongside it, and exits
    non-zero. No criterion has been quietly redefined.
