# --------------------------------------------------------------------------- #
# The strategy, as the source defines it
# --------------------------------------------------------------------------- #
source_definition:
  entry: run_tiered_router
  tiers:
    - {model: gemini-3.5-flash-lite, thinking_level: null}
    - {model: gemini-3.7-flash, thinking_level: low}
    - {model: gemini-3.7-flash, thinking_level: medium}
  gate: evidence            # GATES["evidence"] == gate_on_evidence(min_attempt=1)
  frontier: claude-opus-5
  frontier_mode: repair
  frontier_max_calls: 1
  error_treatment: straitjacket

# --------------------------------------------------------------------------- #
# The strategy, as this lab executes it
# --------------------------------------------------------------------------- #
# Model refs are PLACEHOLDERS and resolve only through
# manifest/delivery-manifest.yaml (harness/policies/README.md rule 2). No model
# id and no price appears in this file.
lab_execution:
  policy_family: B2_escalation      # cheap attempt -> gate -> escalate (SPEC 2.1b)
  adapter: transfer_r9
  # Three cheap rungs then one frontier rung: the source's rung COUNT, preserved.
  # The rung IDENTITY differs — see judgment call J-2.
  rungs:
    - {rung: 0, leg_id: rung0_economical, role: economical, model_ref: ECONOMICAL_MODEL_A}
    - {rung: 1, leg_id: rung1_economical, role: economical, model_ref: ECONOMICAL_MODEL_A}
    - {rung: 2, leg_id: rung2_economical, role: economical, model_ref: ECONOMICAL_MODEL_A}
  frontier:
    leg_id: frontier_strong
    role: strong
    model_ref: STRONG_MODEL_A
    mode: repair            # the failed attempt's work is HANDED TO the frontier
    max_calls: 1
  # Anchors already measured in this lab (prereg "Anchors already measured").
  anchors:
    frontier_equals: P0     # our P0 == their r0b, claude-opus-5, EXACT model match
    cheap_approximates: C2  # our C2 ~= their r0a, sonnet 4.6 here vs sonnet 5 there
    r0a_version_mismatch:
      source_model: claude-sonnet-5
      lab_model_ref: ECONOMICAL_MODEL_A
      status: approximate
      note: >
        The source's cheap baseline is claude-sonnet-5; this lab's economical
        Product-A tier is claude-sonnet-4-6. Every comparison against r0a is
        therefore APPROXIMATE and must be labelled so. The frontier anchor
        (r0b / P0, claude-opus-5) is an exact match and carries no such caveat.

# --------------------------------------------------------------------------- #
# Gate — the thing this arm actually is
# --------------------------------------------------------------------------- #
gate:
  kind: evidence
  source_symbol: gate_on_evidence
  min_attempt: 1
  requires_typed_evidence: true
  # Evaluated in this order, first match wins. Transcribed from
  # source/gate-on-evidence.py.txt; the `why` strings are the source's, verbatim,
  # so a routing event in our log is greppable against theirs.
  rules:
    - {order: 1, when: "attempt < min_attempt", escalate: false,
       why: "attempt {attempt} < min_attempt {min_attempt}"}
    - {order: 2, when: "difficulty is None", escalate: false,
       why: "no difficulty signal"}
    - {order: 3, when: "difficulty.is_environment", escalate: false,
       why: "environment failure ({guard}); no model fixes this"}
    - {order: 4, when: "difficulty.is_hard", escalate: true,
       why: "evidence says {level}: {reasons}"}
    - {order: 5, when: "attempt >= total_rungs", escalate: true,
       why: "cheap rungs exhausted ({attempt}/{total_rungs})"}
    - {order: 6, when: "otherwise", escalate: false,
       why: "evidence says {level}; keep it cheap"}
  # Source invariant, preserved: an evidence gate that never receives typed
  # evidence is a counter gate wearing the wrong label. Our engine sets
  # `degraded: true` on the run and says so in the routing event, exactly as
  # run_tiered_router's _warn_once does.
  degrade_if_untyped: true
  # Source invariant, preserved: once the frontier budget is spent the gate's
  # "yes" is overridden and the ladder continues on cheap rungs.
  frontier_budget_override_why: "frontier budget spent ({max_calls})"

# --------------------------------------------------------------------------- #
# Evidence — what the gate is allowed to read
# --------------------------------------------------------------------------- #
evidence:
  # THE SEALED GATE IS NOT AN INPUT. Routing reads gate-public.json only. This is
  # not an implementation convenience: it is the registered mechanism (prereg
  # "Transplanted gates can only route on runtime-visible signals"). A gate that
  # could read the sealed verdict would be measuring the oracle, not the strategy.
  reads: [gate_public_report]
  never_reads: [gate_hidden_report, sealed_defect_map, hidden_test_output]
  report_path: gate-public.json
  report_shape: '{"gate": "public", "checks": [{"id", "status", "detail"}]}'
  # classify() equivalents, values transcribed from source/routing-constants.py.txt.
  broad_failure_items: 3
  levels: [shallow, local, broad, stalled, environment]
  is_hard_levels: [broad, stalled]
  # A failing check id maps to a source failure CLASS. The mapping is the
  # transplant's load-bearing approximation — see judgment call J-3.
  check_classes:
    G0-subject-readable: environment   # the harness broke; no model fixes it
    P6-diff-scope: malformed           # "response was not a usable diff" -> shallow
    P5-no-leakage: malformed
    T1-diff-scope: malformed
    P3-typecheck: shallow              # does not parse / does not type -> shallow
    P4-build: shallow
    P1-public-test: behavioural        # a real test failure -> local or broad by count
    P2-regression: behavioural
    T2-suite-green: behavioural
    T3-coverage: behavioural
    T4-tests-pass: behavioural
  unmapped_check_class: behavioural
  # Levels, in the source's own precedence:
  #   environment  : any failing check maps to `environment`
  #   shallow      : every failing check maps to shallow or malformed
  #   broad        : failing count >= broad_failure_items
  #   stalled      : the failing id SET is identical to the previous attempt's
  #   local        : otherwise
  # `stalled` is evaluated last and overrides, exactly as classify() does.
  stalled_overrides: true

  # --- CALIBRATION PROFILE ------------------------------------------------- #
  # The probe classifies from OUR public acceptance-check report. Calibration
  # classifies from the SOURCE's oracle output, because calibration runs the
  # source's own BigCodeBench-Hard tasks under the source's own unit-test suite
  # and there is no acceptance-check report to read.
  #
  # In the source, the typed evidence comes from an external capture harness
  # (`ctx run`) that returns an evidence GRAPH: per-test identities plus a
  # failure_class each. That harness is not part of the source repository. The
  # source's own fallback when it is missing is `typed=False`, which makes an
  # evidence gate degrade to ladder exhaustion — i.e. r9 stops being r9.
  # Calibrating r9 that way would compare our r6 against their r9 and call the
  # difference a transfer failure.
  #
  # AMENDED 2026-08-30 under prereg Amendment 4. The harness was found, pinned
  # and installed (`capture_harness` below), so the two facts are no longer
  # reconstructed: they are read from the harness's own evidence graph, through
  # the source's own wrapper, exactly as the published rows were produced. What
  # changed is where the facts come from. The LEVEL RULES did not change and are
  # the same lines of code the regex path runs — same shallow-class set, same
  # broad_failure_items, same stall check (harness/adapters/transfer_spec.py,
  # `_level_from_facts`). Amendment 4 permits altering only how failure evidence
  # is captured and digested; this is that change and nothing else.
  #
  # The superseded reconstruction is left recorded below (`identity_pattern`,
  # `exception_pattern`) because it is what produced the 2026-08-27 r9 dataset
  # and a reader comparing the two runs needs to see what the earlier one read.
  # It is no longer on r9's path: with `capture_harness` declared, the runner
  # refuses rather than falling back to it.
  calibration:
    source_symbol: classify
    fact_tier: ctx_harness_evidence_graph
    fact_tier_in_source: ctx-harness evidence graph (same harness, now installed)
    fact_tier_superseded: reconstructed_from_unittest_stderr   # until 2026-08-30
    # --- the source's capture harness, as installed here (Amendment 4) ------- #
    # Identified as the source's `ctx run` from the digest header
    # (`[ctx run:<id> profile=<profile>]`), the package name, and the API surface
    # the source's wrapper calls. The upstream author has NOT confirmed this
    # identification; the pin is exact either way, but the claim that this is
    # *the* harness behind the published rows is unconfirmed.
    capture_harness:
      status: installed
      author_confirmation: pending
      repo: https://github.com/vamsiramakrishnan/straitjacket
      commit: 7c69ea70aa40e1017aa6114b19e977225dd4166f
      package: ctx-harness
      package_version: 0.35.1
      build_backend: hatchling
      import_root: ctx
      # sha256 over the installed package directory: the 144 non-.pyc files
      # under site-packages/ctx, as
      #   find . -type f ! -name '*.pyc' | sort | xargs sha256sum | sha256sum
      installed_sha256: 016aca7bf3a2424d78d0e35fc0938acdf877bc393b2998a82f88609a1f5b5f33
      # ctx-harness requires Python >= 3.11; this lab's harness runs on 3.10, so
      # the capture — and only the capture — runs under its own interpreter. The
      # graded CHILD still runs under the harness interpreter, which is where
      # the slice's scientific stack lives, so the oracle did not move.
      interpreter: ~/.cache/lab-ctx-venv/bin/python
      interpreter_version: CPython 3.12.14
      interpreter_env_override: LAB_CTX_PYTHON
      # We do not call ctx directly: DigestContext.load needs a Store, a
      # Workspace and a stream manifest that only the source's wrapper builds.
      wrapper:
        path: harness/vendor/straitjacket.py
        from_repo: https://github.com/lexha-redstone/tokenomics-benchmark-multi-llms
        from_sha: 1a18b04385f9a0da16439ba5f48a2f68ac08d53d
        from_path: src/straitjacket.py
        sha256: b67f81be502c427030d87f6ebf68ad9c1f87ff5f950bb87a8455c9482dadc35b
      flow: evaluator._run_bigcodebench_contained   # reproduced in harness/vendor/sj_capture.py
      digest_from: ContainedRun.digest              # triage_error_straitjacket's return
      facts_from: ContainedRun.evidence_graph()     # classify()'s input
    identity_pattern: '^(?:FAIL|ERROR): (\S+)'      # SUPERSEDED — see above
    exception_pattern: '^([A-Za-z_][A-Za-z0-9_.]*(?:Error|Exception|Warning))\b'  # SUPERSEDED
    shallow_classes:                   # routing._SHALLOW_CLASSES, verbatim
      - SyntaxError
      - IndentationError
      - TabError
      - ImportError
      - ModuleNotFoundError
      - NameError
    environment_classes:               # routing._ENVIRONMENT_CLASSES, verbatim
      - EnvironmentError
    untyped_when: >
      No FAIL:/ERROR: line and no exception name could be read from the runner's
      output. Recorded untyped, exactly as the source records a missing fact
      tier — never silently downgraded to a count.

# --------------------------------------------------------------------------- #
# Prompts — verbatim, two profiles
# --------------------------------------------------------------------------- #
# The calibration profile IS the source's, byte for byte, because calibration
# runs the source's own BigCodeBench-Hard tasks under the source's own oracle and
# any deviation would make the fidelity check meaningless.
#
# The probe profile keeps the source's SCAFFOLDING verbatim (the repair role, the
# digest block, the ordering) and substitutes this lab's pinned task prompt for
# the BCB `complete_prompt`, because W4/W4b/W6 are not function-completion
# problems and the source prompt has no referent on them. See judgment call J-4.
prompts:
  calibration:
    rung0:
      builder: _build_initial_prompt
      role_file: source/solver-role.py.txt
      shape: "SOLVER_ROLE + 'Problem:\\n```python\\n' + complete_prompt + '\\n```\\n\\nWrite the complete solution.'"
    repair:
      builder: _repair_prompt
      role_file: source/repair-role.py.txt
      evidence_label: "Straitjacket Triaged Error Digest"
      shape: "REPAIR_ROLE + 'Problem:' + statement + 'Current solution:' + sol + label + digest + 'Write the complete corrected solution.'"
  probe:
    rung0:
      source: task.yaml prompt          # this lab's pinned, hashed task prompt
      wrapper: none                     # rung 0 is the task exactly as every other arm sees it
    repair:
      role_file: source/repair-role.py.txt
      role_substitution:
        # REPAIR_ROLE names "unit tests" and "the function definition"; on a review
        # or bugfix task there is no function to re-emit. The role text is used
        # VERBATIM for calibration and is REPLACED for the probe by the block
        # below, which preserves its three moves (you failed, here is bounded
        # evidence, emit the complete corrected artefact) without asserting a
        # Python function exists. Recorded as judgment call J-4.
        applies_to: probe
        text: |
          A previous attempt at the task below FAILED its acceptance checks.
          Read the bounded check digest, find the defect, and produce the
          COMPLETE corrected artefact the task asks for — not a diff, not a
          fragment, and not a description of what you would change.
      evidence_label: "Public Acceptance-Check Digest"
      digest:
        # The source's digest is produced by triage_error_straitjacket at $0.00 with
        # no API call (source/treat-error.py.txt). Ours is likewise mechanical and
        # free: the failing entries of gate-public.json, rendered. No model is asked
        # to summarise anything, so no model self-report enters the loop
        # (CLAUDE.md rule 2).
        producer: harness
        cost_usd: 0.0
        api_calls: 0
        content: "one line per FAILING public check: '<id>: <detail>'"
        cap_chars: 2500       # source SJ_RAW_CAP, preserved
  # The digest is the ONLY thing that crosses from a failed rung into the next
  # prompt under `mode: repair`, plus the failed attempt's own artefact (`sol`).
  carries_over: [failed_artefact, digest]

# --------------------------------------------------------------------------- #
# What this arm is in the probe
# --------------------------------------------------------------------------- #
mechanism_under_test: >
  r9's gate reads the cheap model's own failure evidence, so it inherits whatever
  that evidence is blind to. On W6 the sealed gate scores a review report by line
  proximity (+/-3 lines) while every runtime-visible signal says the report is
  fine; the prereg therefore predicts r9 under-escalates and transfers WORST of
  the three. r10, which consumes none of the cheap output, is the control.
  Registered break-even: escalation beats expensive-solo iff p_cheap >
  C_cheap / C_exp (44% on W6 against an observed 33%).

# --------------------------------------------------------------------------- #
# Judgment calls
# --------------------------------------------------------------------------- #
# Every place where the transplant could not be mechanical. Listed because a
# spec claiming zero judgment calls is a spec whose author did not look.
judgment_calls:
  - id: J-1
    decision: >
      The strategies are recorded as ROUTING POLICIES (harness/policies/) even
      though a run records them in `configuration_id`, which is where P0/P1/P2
      already sit. Nothing in the schema distinguishes the two axes.
    alternative: A new `harness/configurations/R9.yaml` stack file.
    why: >
      A configuration declares the stack; a policy declares the routing decision
      (SPEC 2.1c). These three differ ONLY in the routing decision — same models,
      same products, same task. Filing them as configurations would have made the
      one axis they vary invisible.
    risk: >
      `configuration_id` now carries values from two axes. It already did (P0/P1/P2
      vs C1..C5); this widens an existing ambiguity rather than creating one.
  - id: J-2
    decision: >
      The three cheap rungs are all ECONOMICAL_MODEL_A (Product A). The source's
      rungs are three DIFFERENT Gemini tiers (flash-lite, 3.7-low, 3.7-medium).
      Rung COUNT (3) and frontier (1, Opus-5) are preserved exactly; rung identity
      is not.
    alternative: >
      Map the ladder onto Product B: PRODUCT_B_ECON_TIER_PREV (3.6 High) ->
      PRODUCT_B_ECON_TIER_MED (3.7 Medium) -> PRODUCT_B_ECON_TIER (3.7 High).
    why: >
      Three reasons, in order of weight. (a) The registered W4b finding is THE
      BILL — cost of failure. Product-B legs are cache-blind upper bounds at best
      and frequently record usage as `unavailable`, so a Product-B ladder would
      make the probe's primary measurement unmeasurable. (b) The prereg's anchors
      are Product A: P0 == their r0b exactly, C2 ~= their r0a. A Product-B ladder
      has no measured anchor in this lab. (c) manifest effort_rule forbids mixing
      effort tiers with routing ("would confound routing with effort"); the
      Product-B mapping mixes both effort AND model generation across rungs.
    risk: >
      Three identical rungs mean rungs 1 and 2 differ from rung 0 only by the
      repair prompt and the accumulated evidence. That is exactly what the
      source's own r0a/r0b baselines do (`tiers=[(SONNET_ID, None)] * 3`), so it
      is a shape the source itself ships — but it does weaken "ladder" to "retry
      with evidence" and any finding must say so. It also removes cross-product
      routing from the probe entirely.
  - id: J-3
    decision: >
      Failing PUBLIC CHECK IDS stand in for the source's typed failing
      identities, and each check id is mapped to a source failure class by the
      `evidence.check_classes` table above.
    alternative: >
      Parse test-runner output inside the subject tree to recover real failing
      test identities, closer to the source's evidence graph.
    why: >
      The source's evidence graph is a by-product of a capture that already
      happened (ContainedRun.evidence_graph). Our equivalent already-existing
      by-product is gate-public.json. Re-deriving test identities would mean the
      harness parsing per-stack test output for three different stacks, which is
      new measurement machinery inside a probe — and on W6 (`stack: none`) there
      is no test output to parse at all.
    risk: >
      Granularity loss. The source counts failing TEST identities; we count
      failing CHECK ids, of which there are at most ~6. `broad_failure_items: 3`
      is therefore a much coarser threshold here than there, and a run can be
      `local` with many underlying test failures behind one failed check. This is
      the single largest fidelity gap in the transplant and the calibration gate
      does NOT test it (calibration runs BCB, where the source's own oracle
      supplies real identities).
  - id: J-4
    decision: >
      Two prompt profiles. Calibration uses the source's prompts byte for byte.
      The probe keeps the source's repair SCAFFOLDING and digest ordering but
      replaces REPAIR_ROLE's text (see `prompts.probe.repair.role_substitution`)
      and substitutes the lab's pinned task prompt for BCB's `complete_prompt`.
    alternative: Use REPAIR_ROLE verbatim on the probe tasks too.
    why: >
      REPAIR_ROLE says "FAILED its unit tests", "the full function definition",
      "Output ONLY one ```python code block". On W6 the deliverable is
      `review-report.txt`; on W4/W4b it is a repository edit. Verbatim text would
      instruct the model to produce something the acceptance gate refuses, and
      would measure prompt/task mismatch rather than routing.
    risk: >
      The probe's repair turn is NOT the source's repair turn. Any transfer
      failure attributable to prompt wording rather than routing is a confound;
      the substituted text is pinned here so a reader can judge it.
  - id: J-5
    decision: >
      The digest is produced by the harness from gate-public.json at $0.00 with
      no API call, mirroring triage_error_straitjacket.
    alternative: An LLM-produced triage digest (the source's `llm` treatment).
    why: >
      All three transplanted arms declare `error_treatment: straitjacket`, i.e.
      the $0 contained digest. An LLM digest would be a different arm (the source
      has one) and would add an unbilled model call to every repair turn.
    risk: >
      Our digest is a list of failed check lines, not a contained test-frame
      extraction. It is smaller and less informative than the source's. Recorded
      because it plausibly biases r9 TOWARD under-escalating, which is the
      direction the prereg already predicts — so a confirmed prediction here is
      weaker evidence than it looks.
  - id: J-6
    decision: >
      `frontier_max_calls: 1` is preserved, including the source's behaviour that
      a spent frontier budget sends the ladder BACK to a cheap rung rather than
      ending the run (observed in the published trace for BigCodeBench/101, where
      r9's rungs are lite -> opus-5 -> 3.7-medium).
    alternative: End the run once the frontier attempt fails.
    why: It is what the source does, and the published per-task costs include it.
    risk: >
      On a lab task this means a cheap rung runs AFTER the expensive one, and the
      final artefact graded is the cheap rung's. Counter-intuitive when reading a
      run log; called out here so it is not read as a bug.
  - id: J-7
    decision: >
      The sonnet version mismatch on the r0a anchor is recorded and carried into
      every comparison as "approximate" (see lab_execution.anchors).
    alternative: Re-pin ECONOMICAL_MODEL_A to claude-sonnet-5 for the probe.
    why: >
      Re-pinning a manifest model is a human decision with batch-comparability
      consequences well beyond this probe, and this instrument does not touch the
      manifest.
    risk: Every r0a-referenced comparison is approximate. Labelled, not resolved.
  - id: J-11
    status: RESOLVED 2026-08-30 by J-13 (prereg Amendment 4)
    decision: >
      SUPERSEDED. For the CALIBRATION profile only, the typed evidence the gate
      reads was reconstructed from the unittest runner's stderr (failing
      identities from FAIL:/ERROR: lines, failure classes from traceback
      exception names) instead of from the source's external capture harness,
      whose evidence graph was believed unavailable. Kept because it is what
      produced the 2026-08-27 r9 calibration dataset.
    alternative: >
      Run calibration with no fact tier, exactly as the source does when the
      harness is absent.
    why: >
      With no fact tier the source's own code marks the run degraded and an
      evidence gate becomes a counter gate — r9 stops being r9. A calibration
      that compares our ladder-exhaustion arm against their evidence-gated arm
      would report a transfer failure that is entirely an artefact of a missing
      tool. The LEVEL RULES are untouched: same shallow-class set, same
      broad_failure_items, same stall check.
    risk: >
      Highest-consequence judgment call in the transplant. Our identities are
      test method names parsed from text; theirs came from an instrumented run.
      Where the two disagree, r9's calibration rows will disagree with the
      published ones for a reason that is ours, not the strategy's. Recorded in
      the calibration report as a non-gating diagnostic (routing_shape_match) so
      a mismatch is visible rather than absorbed into the pass/fail criterion.
      This risk is what the 2026-08-27 run realised, and it is why Amendment 4
      authorised the repair below.
  - id: J-13
    decision: >
      The source's capture harness is installed at a pinned commit
      (`evidence.calibration.capture_harness`) and the calibration profile reads
      its digest and its typed evidence graph, through the source's own vendored
      wrapper, end to end. J-11's reconstruction is retired from r9's path.
    alternative: Keep J-11's regex reconstruction and accept the 3/5 pass match.
    why: >
      Prereg Amendment 4: r9 re-enters only if a repaired evidence path passes
      criterion (a) at 5/5, and the repair may change only HOW failure evidence
      is captured and digested. Reading the facts the source's own harness types
      is the smallest change that removes the gap, because it removes our
      derivation entirely rather than improving it. Gate logic, thresholds,
      prompts and the escalation rule are unchanged; the level rules are
      literally the same function the regex path calls.
    risk: >
      Three, all recorded rather than resolved. (a) The identification of
      ctx-harness as the source's `ctx run` is this lab's inference and is
      "author confirmation pending" — if it is the wrong harness, the facts are
      a different tool's facts and the fidelity claim weakens to "an instrumented
      evidence graph" rather than "theirs". (b) The digest the model repairs from
      changed (harness digest, not a raw stderr tail), so r9's repair turns are
      not comparable, prompt for prompt, with the 2026-08-27 r9 dataset; that
      dataset is superseded, not amended. (c) The capture now runs under a second
      interpreter. The graded child does not, so the oracle is unmoved, but the
      run has one more moving part than r6 and r10 have and any r9-only anomaly
      must be checked against it first.
  - id: J-12
    decision: >
      Calibration reads the product's FINAL RESPONSE TEXT as the candidate
      solution and grades it with the source's `extract_code` +
      `missing_code_error`, instead of grading a file the agent wrote. The
      source's prompts are then used byte for byte, with no added delivery
      instruction.
    alternative: >
      Append "write the solution to solution.py" to the source's prompt and grade
      the file the CLI leaves behind.
    why: >
      The calibration profile's whole claim is that the prompts are the source's,
      byte for byte; a delivery instruction would break that on the one path
      whose job is to detect exactly that kind of drift. The source's subject is
      a chat completion whose deliverable IS the response, and `extract_code`
      already handles both a fenced block and a bare body.
    risk: >
      The subject is an agentic CLI, not a chat completion: it may use tools,
      take several turns, and write files that calibration ignores, and its
      turn count is not the source's one-shot call. Two consequences, both
      recorded rather than corrected — the calibration bill includes agentic
      overhead the published figures never had (which biases criterion (b)
      upward, in the same direction as the structural blocker already recorded
      in calibration-slice.yaml), and a run that solves the task by writing a
      file but never restates the code in its reply is scored a birth-gate
      failure. The response text is kept beside each attempt so that case is
      identifiable rather than invisible.
