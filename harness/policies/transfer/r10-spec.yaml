# r10 — "Opus re-solves from scratch". Transplanted strategy spec, FROZEN.
#
# This file is DATA. harness/adapters/transfer_r10.py reads it and nothing else.
# Prereg (authoritative): manifest/preregistrations/2026-08-27-transfer-probe.md
#
# r10 is the CONTROL ARM of this probe, and it is not optional. It is identical
# to r6 in every respect except one line — `frontier_mode: fresh` — so the
# frontier turn consumes NONE of the cheap model's output except a bounded
# digest. The three arms therefore form a gradient of trust in what the cheap
# model produced: r9 READS the failure evidence, r6 COUNTS it, r10 DISCARDS it.
# If W6 transfer breaks in the predicted order (r10 best, r6 partial, r9 worst),
# that gradient is the explanation.

